<svg xmlns="http://www.w3.org/2000/svg" width="420" height="64" viewBox="0 0 420 64" role="img" aria-labelledby="badge-title badge-desc">
  <title id="badge-title">README made with beautify-github-readme</title>
  <desc id="badge-desc">Badge showing README was crafted with beautify-github-readme.</desc>

  <rect width="420" height="64" rx="12" fill="#0C1322" stroke="#1F2F4A" stroke-width="1.2"/>

  <!-- Battery & Bolt Motif -->
  <g transform="translate(20, 18)">
    <rect x="0" y="4" width="30" height="20" rx="4" fill="#142036" stroke="#253858" stroke-width="1.2"/>
    <rect x="30" y="9" width="3" height="10" rx="1.5" fill="#253858"/>
    <!-- Battery Level Bar (Green) -->
    <rect x="3" y="7" width="18" height="14" rx="2" fill="#10B981"/>
    <!-- Lightning Bolt -->
    <path d="M12 9 L9 15 L13 15 L11 20 L16 13 L12 13 Z" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <g transform="translate(68, 22)">
    <text x="0" y="11" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">README DESIGNED WITH</text>
    <text x="0" y="27" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13.5" font-weight="600">beautify-github-readme</text>
  </g>

  <!-- Outbound Arrow Icon -->
  <g transform="translate(378, 24)">
    <circle cx="10" cy="8" r="14" fill="#142036" stroke="#253858" stroke-width="1"/>
    <path d="M6 12 L14 4 M14 4 H9 M14 4 V9" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>